<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CINEMATIC — Step Through. Work Smarter.</title>
    <meta
      name="description"
      content="A hand-built streaming library: 1,800 films, 240 series, 4K HDR, zero ads."
    />
    <meta name="theme-color" content="#000000" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <!-- lucide-react's UMD build resolves React from a lowercase `react` global -->
    <script>
      window.react = window.React
    </script>
    <script src="https://unpkg.com/lucide-react@0.454.0/dist/umd/lucide-react.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.9/babel.min.js"></script>

    <style>
      /* Visible fallback instead of a blank black page if a CDN is blocked */
      #boot-error {
        display: none;
        padding: 24px;
        font: 13px/1.7 ui-monospace, SFMono-Regular, monospace;
        color: #fca5a5;
        white-space: pre-wrap;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <pre id="boot-error"></pre>

    <script>
      window.addEventListener('error', function (e) {
        var box = document.getElementById('boot-error')
        box.style.display = 'block'
        box.textContent += (e.message || e.error || 'Unknown error') + '\n' + (e.filename || '') + '\n\n'
      })
    </script>

    <!-- Content first, then primitives, then sections, then the composed app.
         Babel Standalone transforms each file in order; they share one scope. -->
    <script src="./src/data.js"></script>
    <script type="text/babel" data-presets="react" src="./src/ui.jsx"></script>
    <script type="text/babel" data-presets="react" src="./src/Navbar.jsx"></script>
    <script type="text/babel" data-presets="react" src="./src/Hero.jsx"></script>
    <script type="text/babel" data-presets="react" src="./src/sections-browse.jsx"></script>
    <script type="text/babel" data-presets="react" src="./src/sections-editorial.jsx"></script>
    <script type="text/babel" data-presets="react" src="./src/sections-convert.jsx"></script>
    <script type="text/babel" data-presets="react" src="./src/App.jsx"></script>
  </body>
</html>
